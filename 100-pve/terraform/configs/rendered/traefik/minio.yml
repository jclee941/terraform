http:
  routers:
    minio:
      rule: Host(`minio.jclee.me`)
      entryPoints:
        - websecure
      service: minio
      middlewares:
        - registry-allowlist@file
        - rate-limit-relaxed@file
      tls:
        certResolver: cf
      priority: 10

    minio-http:
      rule: Host(`minio.jclee.me`)
      entryPoints:
        - web
      service: minio
      middlewares:
        - registry-allowlist@file
        - rate-limit-relaxed@file
      priority: 10

  services:
    minio:
      loadBalancer:
        servers:
          - url: http://192.168.50.215:9001
