name: CI

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.22.2
          cache: false
      - name: Check Terraform formatting
        run: make lint-tf
      - name: Validate Terraform workspaces
        run: |
          make validate SVC=pve
          make validate SVC=elk
          make validate SVC=synology
          make validate SVC=cloudflare
      - name: Run Terraform tests
        run: make test
      - name: Run Go tests
        run: make test-go
      - name: Validate documentation
        run: make lint-docs
